# Configuration Alembic — AgAtA-AI-CHATBOOK
# L'URL de la base n'est PAS écrite ici : elle vient de la variable DATABASE_URL (voir migrations/env.py).
#   Appliquer les migrations      : alembic upgrade head
#   Créer une nouvelle révision   : alembic revision --autogenerate -m "description"
#   Voir l'état                   : alembic current   /   alembic history

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
