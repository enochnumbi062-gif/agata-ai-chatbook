services:
  - type: web
    name: agata-ai-chatbook
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: MODERATOR_PROVIDER
        value: gemini
      - key: PLATFORM_GEMINI_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agata-redis
          property: connectionString
  - type: keyvalue
    name: agata-redis
    region: frankfurt
    plan: free
